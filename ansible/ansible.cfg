[defaults]
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
# roles_path is relative to this file when ANSIBLE_CONFIG=$PWD/ansible/ansible.cfg is exported
# (ansible-config resolves ./roles against the config file path, not cwd). Keep export in docs.
roles_path = ./roles:~/.ansible/roles
collections_paths = ~/.ansible/collections:/usr/share/ansible/collections
timeout = 20

[ssh_connection]
pipelining = True
