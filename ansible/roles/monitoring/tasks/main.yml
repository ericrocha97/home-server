---
- name: Validate monitoring defaults
  ansible.builtin.assert:
    that:
      - monitoring_chart_version is string
      - monitoring_prometheus_retention is string
      - monitoring_prometheus_retention | length > 0
      - prometheus_nodeport == 30909
      - grafana_nodeport == 30300

- name: Validate Docker exporter selection
  ansible.builtin.assert:
    that:
      - docker_metrics_exporter_mode in ['upstream', 'built']
      - docker_metrics_exporter_image is string
      - docker_metrics_exporter_image | length > 0
      - "'latest' not in docker_metrics_exporter_image"
      - docker_metrics_exporter_port == 9797
    fail_msg: >-
      docker_metrics_exporter_mode must be upstream or built with a pinned
      docker_metrics_exporter_image (never latest) on port 9797.

- name: Validate monitoring Vault contract
  ansible.builtin.assert:
    that:
      - monitoring_grafana_admin_password is defined
      - monitoring_grafana_admin_password | length > 0
      - jenkins_prometheus_api_token is defined
      - jenkins_prometheus_api_token | length > 0
      - jenkins_prometheus_user is string
      - jenkins_prometheus_user | length > 0
      - monitoring_jenkins_metrics_path == '/prometheus/'
      - monitoring_chart_version == '88.6.1'
      - monitoring_release_name == 'monitoring'
    fail_msg: >-
      Slice 3 monitoring Vault is incomplete — define
      monitoring_grafana_admin_password and the Task 3
      jenkins_prometheus_api_token before installing the stack.
  no_log: true

- name: Ensure docker-metrics-exporter build directory exists
  ansible.builtin.file:
    path: "{{ docker_metrics_exporter_build_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: docker_metrics_exporter_mode == 'built'

- name: Copy docker-metrics-exporter build context to host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../k8s/monitoring/docker-metrics-exporter/{{ item }}"
    dest: "{{ docker_metrics_exporter_build_dir }}/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - app.py
    - requirements.txt
    - Dockerfile
  when: docker_metrics_exporter_mode == 'built'

- name: Build docker-metrics-exporter image on host
  community.docker.docker_image:
    name: "{{ docker_metrics_exporter_image }}"
    source: build
    build:
      path: "{{ docker_metrics_exporter_build_dir }}"
  when: docker_metrics_exporter_mode == 'built'

- name: Check docker-metrics-exporter image in k3s containerd
  ansible.builtin.shell: |
    k3s ctr images ls -q | grep -Fx "{{ docker_metrics_exporter_image }}"
  register: exporter_image_present
  changed_when: false
  failed_when: false
  when: docker_metrics_exporter_mode == 'built'

- name: Import docker-metrics-exporter image into k3s containerd
  ansible.builtin.shell: |
    docker save "{{ docker_metrics_exporter_image }}" | k3s ctr images import -
  changed_when: true
  when:
    - docker_metrics_exporter_mode == 'built'
    - (exporter_image_present.rc | default(1)) != 0

- name: Ensure monitoring namespace exists
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ monitoring_namespace }}"

- name: Create Grafana admin Secret from Vault
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ monitoring_grafana_admin_secret_name }}"
        namespace: "{{ monitoring_namespace }}"
      type: Opaque
      stringData:
        admin-user: "{{ monitoring_grafana_admin_user }}"
        admin-password: "{{ monitoring_grafana_admin_password }}"
  no_log: true

- name: Create Prometheus additional scrape configs Secret from Vault
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ monitoring_additional_scrape_configs_name }}"
        namespace: "{{ monitoring_namespace }}"
      type: Opaque
      stringData:
        "{{ monitoring_additional_scrape_configs_key }}": >-
          {{ lookup('template', 'additional-scrape-configs.yaml.j2') }}
  no_log: true

- name: Render kube-prometheus-stack values
  ansible.builtin.template:
    src: values.yaml.j2
    dest: "{{ monitoring_values_path }}"
    owner: root
    group: root
    mode: '0600'

- name: Ensure prometheus-community Helm repository
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts

- name: Install or upgrade kube-prometheus-stack
  kubernetes.core.helm:
    name: "{{ monitoring_release_name }}"
    chart_ref: prometheus-community/kube-prometheus-stack
    chart_version: "{{ monitoring_chart_version }}"
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: true
    values_files:
      - "{{ monitoring_values_path }}"
    state: present
    wait: true
    wait_timeout: 600s

- name: Render docker-metrics-exporter manifests
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/tmp/home-server-{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - docker-exporter-deployment.yaml
    - docker-exporter-service.yaml
    - docker-exporter-servicemonitor.yaml

- name: Apply docker-metrics-exporter manifests
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    src: "/tmp/home-server-{{ item }}"
  loop:
    - docker-exporter-deployment.yaml
    - docker-exporter-service.yaml
    - docker-exporter-servicemonitor.yaml

- name: Ensure stable Prometheus ClusterIP Service
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ monitoring_prometheus_service_name }}"
        namespace: "{{ monitoring_namespace }}"
        labels:
          labmonitor.enabled: "true"
          labmonitor.id: "prometheus"
          labmonitor.category: "observability"
          labmonitor.icon: "prometheus"
        annotations:
          labmonitor.name: "Prometheus"
          labmonitor.open.url: "https://prometheus.{{ base_domain }}"
      spec:
        type: ClusterIP
        # Proven against chart 88.6.1: same selector as the generated
        # monitoring-kube-prometheus-prometheus Service (the chart
        # fullname truncates to 26 chars -> monitoring-kube-prometheus,
        # plus operator.prometheus.io/name from the _helpers.tpl crname
        # helper). Task 7 consumes this stable name; never the
        # generated Helm name.
        selector:
          app.kubernetes.io/name: prometheus
          operator.prometheus.io/name: >-
            {{ monitoring_release_name }}-kube-prometheus-prometheus
        ports:
          - name: http
            protocol: TCP
            port: "{{ monitoring_prometheus_service_port }}"
            targetPort: 9090

- name: Assert stable Prometheus Service has ready endpoints
  ansible.builtin.shell: |
    set -euo pipefail
    test -n "$(kubectl --kubeconfig={{ kubeconfig_path }} \
      -n {{ monitoring_namespace }} \
      get endpoints {{ monitoring_prometheus_service_name }} \
      -o jsonpath='{.subsets[*].addresses[*].ip}')"
  changed_when: false

- name: Ensure stable Grafana ClusterIP Service
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ monitoring_grafana_service_name }}"
        namespace: "{{ monitoring_namespace }}"
        labels:
          labmonitor.enabled: "true"
          labmonitor.id: "grafana"
          labmonitor.category: "observability"
          labmonitor.icon: "grafana"
        annotations:
          labmonitor.name: "Grafana"
          labmonitor.open.url: "https://grafana.{{ base_domain }}"
      spec:
        type: ClusterIP
        # Proven against chart 88.6.1 (helm template): the chart Service
        # monitoring-grafana selects app.kubernetes.io/name=grafana plus
        # app.kubernetes.io/instance=<release>. Task 7 consumes this stable
        # name; the Task 8 monitoring/grafana:3000 Ingress backend points here.
        selector:
          app.kubernetes.io/name: grafana
          app.kubernetes.io/instance: "{{ monitoring_release_name }}"
        ports:
          - name: http
            protocol: TCP
            port: "{{ monitoring_grafana_service_port }}"
            targetPort: 3000

- name: Assert stable Grafana Service has ready endpoints
  ansible.builtin.shell: |
    set -euo pipefail
    test -n "$(kubectl --kubeconfig={{ kubeconfig_path }} \
      -n {{ monitoring_namespace }} \
      get endpoints {{ monitoring_grafana_service_name }} \
      -o jsonpath='{.subsets[*].addresses[*].ip}')"
  changed_when: false

- name: Apply Grafana technical dashboard ConfigMaps
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "grafana-dashboard-{{ item.name }}"
        namespace: "{{ monitoring_namespace }}"
        labels:
          "{{ monitoring_dashboard_sidecar_label }}": "1"
      data:
        "{{ item.file }}": >-
          {{ lookup('file',
              playbook_dir + '/../k8s/monitoring/dashboards/'
              + item.file) }}
  loop:
    - {name: host, file: host.json}
    - {name: docker, file: docker.json}
    - {name: kubernetes, file: kubernetes.json}
    - {name: jenkins, file: jenkins.json}

- name: Wait for docker-metrics-exporter Deployment
  ansible.builtin.command: >-
    kubectl --kubeconfig={{ kubeconfig_path }} -n {{ monitoring_namespace }}
    wait --for=condition=available deployment/docker-metrics-exporter --timeout=180s
  changed_when: false

# Chart 88.6.1 names releases <release>-kube-prometheus-stack-*; wait by the
# stable app.kubernetes.io/name labels instead of generated resource names.
- name: Wait for Grafana Deployment
  ansible.builtin.command: >-
    kubectl --kubeconfig={{ kubeconfig_path }} -n {{ monitoring_namespace }}
    wait --for=condition=available deployment
    -l app.kubernetes.io/name=grafana --timeout=300s
  changed_when: false

- name: Wait for Prometheus pods Ready
  ansible.builtin.command: >-
    kubectl --kubeconfig={{ kubeconfig_path }} -n {{ monitoring_namespace }}
    wait --for=condition=Ready pod
    -l app.kubernetes.io/name=prometheus --timeout=600s
  changed_when: false

- name: Wait for node-exporter DaemonSet
  ansible.builtin.command: >-
    kubectl --kubeconfig={{ kubeconfig_path }} -n {{ monitoring_namespace }}
    rollout status daemonset
    -l app.kubernetes.io/name=prometheus-node-exporter --timeout=300s
  changed_when: false

- name: Wait for kube-state-metrics Deployment
  ansible.builtin.command: >-
    kubectl --kubeconfig={{ kubeconfig_path }} -n {{ monitoring_namespace }}
    wait --for=condition=available deployment
    -l app.kubernetes.io/name=kube-state-metrics --timeout=300s
  changed_when: false
