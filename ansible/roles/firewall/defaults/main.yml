---
firewall_backend: ufw
firewall_trusted_cidrs:
  - "{{ lan_cidr }}"
firewall_optional_cidrs:
  - "{{ vpn_cidr }}"
firewall_slice1_tcp_ports:
  - { port: '22', comment: 'SSH' }
  - { port: '80', comment: 'Traefik HTTP' }
  - { port: '443', comment: 'Traefik HTTPS' }
  - { port: '9090', comment: 'Cockpit' }
  - { port: '6443', comment: 'Kubernetes API' }
firewall_slice2_tcp_ports:
  - { port: "{{ compose_jenkins_port | default(18080) }}", comment: 'Jenkins' }
  - { port: "{{ compose_metabase_port | default(13001) }}", comment: 'Metabase' }
  - { port: "{{ compose_n8n_port | default(15678) }}", comment: 'n8n' }
# Backhaul Traefik (k3s pod CIDR -> host)
firewall_compose_backend_ports:
  - { port: "{{ compose_jenkins_port | default(18080) }}", comment: 'Traefik backend Jenkins' }
  - { port: "{{ compose_metabase_port | default(13001) }}", comment: 'Traefik backend Metabase' }
  - { port: "{{ compose_n8n_port | default(15678) }}", comment: 'Traefik backend n8n' }
# Read-only Docker provider backhaul (k3s pod CIDR -> host only, never LAN/VPN)
firewall_provider_backhaul_ports:
  - { port: '12375', comment: 'Docker socket proxy (read-only)' }
# Human-facing NodePorts reachable from LAN/VPN (Slice 3: Portainer UI +
# Grafana + Prometheus — 12375 must never join this allowlist; the socket
# proxy stays pod-only).
firewall_nodeport_allowlist:
  - { port: '30900', comment: 'Portainer UI' }
  - { port: '30300', comment: 'Grafana UI' }
  - { port: '30909', comment: 'Prometheus UI' }
# Portainer Docker Agent backhaul (k3s pod CIDR -> host only, never LAN/VPN)
firewall_portainer_agent_backhaul_ports:
  - { port: '9001', comment: 'Portainer Docker Agent (admin)' }
# PostgreSQL direto é bloqueado por padrão
firewall_postgres_direct_enable: false
firewall_postgres_port: "{{ compose_postgres_port | default(15432) }}"
# Mitigação Docker iptables bypass; não desabilitar enquanto houver portas publicadas
firewall_docker_user_chain_fix: true
firewall_docker_user_chain: HOME_SERVER_DOCKER
firewall_docker_user_script_path: /usr/local/sbin/home-server-docker-user.sh
firewall_docker_user_unit_name: home-server-docker-user.service
