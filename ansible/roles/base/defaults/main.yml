---
base_timezone: Etc/UTC
base_hostname: "{{ inventory_hostname }}"
base_admin_user: "{{ ansible_user }}"
base_packages:
  - ca-certificates
  - curl
  - git
  - gnupg
  - jq
  - openssh-server
  - python3
  - python3-apt
  - python3-kubernetes
  - python3-requests
  - python3-yaml
  - sudo
  - unattended-upgrades
  - unzip
  - zstd
base_ssh_hardening: true
base_admin_authorized_key_path: ''
home_server_root: /srv/home-server
home_server_directories:
  - path: /srv/home-server
    mode: '0750'
  - path: /srv/home-server/compose
    mode: '0750'
  - path: /srv/home-server/data
    mode: '0750'
  - path: /srv/home-server/backups
    mode: '0700'
  - path: /srv/home-server/restore
    mode: '0700'
