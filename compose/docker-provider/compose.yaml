---
name: docker-provider
services:
  docker-socket-proxy:
    image: "${DOCKER_SOCKET_PROXY_IMAGE:?required}"
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      INFO: "1"
      VERSION: "1"
      POST: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EXEC: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VOLUMES: "0"
    ports:
      - "${DOCKER_SOCKET_PROXY_BIND_IP:?required}:12375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
